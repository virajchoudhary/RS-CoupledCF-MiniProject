name: Unit tests and group roster

on:
  push:
    branches:
      - main
      - "finalize/**"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU PyTorch
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.2,<3"
      - name: Install project dependencies
        run: python -m pip install -r requirements.txt
      - name: Run unit tests (without downloading licensed MovieLens data)
        run: python -m pytest -q
      - name: Verify official assignment group roster
        run: python scripts/final_preflight.py --roster-only
